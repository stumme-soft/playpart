#
# Build and publish PlayPart Docker images to GHCR on each git tag (v*).
# Manual `workflow_dispatch` produces an :edge tag for testing.
#
# Two variants are built in parallel:
#   - cpu : torch CPU wheels, ~1.9 GB
#   - gpu : torch CUDA 12.4 wheels (~6 GB)
# The GPU job frees disk space on the runner first because the ubuntu-latest
# runner only has ~14 GB free by default, not enough for the CUDA build.

name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
          - variant: gpu
            torch_index: https://download.pytorch.org/whl/cu124
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (GPU build)
        if: matrix.variant == 'gpu'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/playpart-${{ matrix.variant }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            TORCH_INDEX=${{ matrix.torch_index }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
