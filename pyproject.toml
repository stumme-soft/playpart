[project]
name = "playpart"
version = "0.1.0"
description = "Music stem separation and remixing web app (LAN, no auth)"
license = "MIT"
authors = [{ name = "Ludovic Stumme" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "librosa>=0.10",
    "demucs>=4.0.1",
    "soundfile>=0.13",
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
